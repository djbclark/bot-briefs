[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefs-dashboard"
version = "0.1.0"
description = "Bot Briefs executive dashboard (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "python-multipart>=0.0.12",
  "starlette>=0.40",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "httpx>=0.28",
  "playwright>=1.64",
]

[project.scripts]
briefs = "briefs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["briefs*"]

[tool.setuptools.package-data]
briefs = ["static/*", "templates/**/*"]
